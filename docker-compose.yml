
services:


  db:
    image: postgres:17-alpine

    container_name: school-admission-db

    restart: unless-stopped

    environment:
      POSTGRES_DB: school_admission
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d school_admission

      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s


 

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: school-admission-api

    restart: unless-stopped

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080

      ConnectionStrings__Default: "Host=db;Port=5432;Database=school_admission;Username=postgres;Password=postgres"

      HOLD_DURATION_SECONDS: ${HOLD_DURATION_SECONDS:-600}

    ports:
      - "8080:8080"

    depends_on:
      db:
        condition: service_healthy


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}

    container_name: school-admission-frontend

    restart: unless-stopped

    ports:
      - "3000:80"

    depends_on:
      backend:
        condition: service_started


volumes:
  postgres_data:
